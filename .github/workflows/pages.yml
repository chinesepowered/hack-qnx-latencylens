# Publishes the codelab (codelab/) to GitHub Pages.
# One-time setup by the repository owner: Settings > Pages > Source: "GitHub Actions".
# The job is skipped while the repository is private.
name: Codelab on GitHub Pages

on:
  push:
    branches: [main]
    paths: ['codelab/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: codelab
      - id: deployment
        uses: actions/deploy-pages@v4
